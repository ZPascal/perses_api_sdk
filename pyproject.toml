[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perses-api-sdk"
version = "0.1.4"
description = "A Python SDK for the Perses API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Pascal Zimmermann" },
]
keywords = ["perses", "api", "sdk", "dashboard", "observability", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/ZPascal/perses_api_sdk"
Repository = "https://github.com/ZPascal/perses_api_sdk"
"Bug Tracker" = "https://github.com/ZPascal/perses_api_sdk/issues"

[project.optional-dependencies]
http2 = ["httpx[http2]"]
test = ["pytest>=7.0", "pytest-httpx>=0.21", "pytest-cov>=4.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["perses_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests requiring a live Perses instance (deselect with '-m not integration')",
]
