[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perses-api-sdk"
version = "0.1.0"
description = "A Python SDK for the Perses API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
http2 = ["httpx[http2]"]
test = ["pytest>=7.0", "pytest-httpx>=0.21", "pytest-cov>=4.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["perses_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests requiring a live Perses instance (deselect with '-m not integration')",
]
